<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Operation: Outlive the Group Chat</title>
<meta name="theme-color" content="#0B3954">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Outlive">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#EEF5F4; --card:#FFFFFF; --ink:#0B2A3A; --muted:#5F7480; --line:#DCE7E5;
  --accent:#0E7C86; --accent-soft:#D5EEEC; --deep:#0B3954; --warm:#E76F51; --warm-soft:#FCE5DC; --down:#B4553C; --sand:#F4D58D;
  --r:18px; --safe-b:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(96px + var(--safe-b))}
header.top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:18px}
.hello{font:600 28px/1.1 "New York","Iowan Old Style",Georgia,serif;letter-spacing:-.01em}
.date{color:var(--muted);font-size:14px;margin-top:4px}
.ver{font-size:11px;color:var(--muted)}
.apptitle{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.apptitle span{font-weight:500;color:var(--muted);letter-spacing:0;text-transform:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card h3{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.grid .card{margin:0}
.big{font:600 30px/1 "SF Pro Rounded",-apple-system,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.big small{font-size:15px;font-weight:500;color:var(--muted);margin-left:2px}
.sub{font-size:13px;color:var(--muted);margin-top:6px}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.chip.dn{background:var(--warm-soft);color:var(--down)}
.src{font-size:11px;color:var(--muted);margin-top:8px}
.row{display:flex;gap:8px}
.pick{flex:1;padding:10px 0;border-radius:12px;background:var(--bg);font-size:22px;transition:transform .1s}
.pick.num{font-size:17px;font-weight:600}
.pick.on{background:var(--accent);color:#fff;transform:scale(1.04)}
.pick:active{transform:scale(.96)}
.empty{color:var(--muted);font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:14px;background:var(--accent);color:#fff;font-weight:600;width:100%}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:var(--safe-b)}
nav.tabs .in{display:flex;max-width:560px;width:100%}
nav.tabs button{flex:1;padding:9px 0 8px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button span{font-size:21px;filter:grayscale(1);opacity:.6}
nav.tabs button.on{color:var(--accent);font-weight:600}
nav.tabs button.on span{filter:none;opacity:1}
section.view{display:none}
section.view.on{display:block}
.soon{text-align:center;padding:40px 16px;color:var(--muted)}
.soon b{display:block;font:600 20px "New York",Georgia,serif;color:var(--ink);margin-bottom:6px}
.login{min-height:80vh;display:flex;flex-direction:column;justify-content:center;gap:16px;text-align:center}
.login h1{font:600 34px/1.1 "New York",Georgia,serif}
.login p{color:var(--muted)}
.files label{display:block;border:1.5px dashed var(--line);border-radius:14px;padding:18px;text-align:center;color:var(--muted);cursor:pointer}
.files input{display:none}
.log{font:12px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap;background:var(--bg);border-radius:12px;padding:10px;margin-top:10px;max-height:260px;overflow:auto}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
table.counts{width:100%;font-size:14px;border-collapse:collapse}
table.counts td{padding:6px 0;border-bottom:1px solid var(--line)}
table.counts td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.spark{display:flex;align-items:flex-end;gap:3px;height:44px;margin-top:10px}
.spark i{flex:1;background:var(--accent-soft);border-radius:3px 3px 0 0;min-height:2px}
.spark i.last{background:var(--accent)}
.note{font-size:12px;color:var(--muted);margin-top:10px}
table.cmp{width:100%;border-collapse:collapse;font-size:14px;margin-top:12px;font-variant-numeric:tabular-nums}
table.cmp th{font-size:11px;font-weight:600;color:var(--muted);text-align:right;padding:4px 0;text-transform:uppercase;letter-spacing:.04em}
table.cmp td{padding:7px 0;border-top:1px solid var(--line);text-align:right}
table.cmp td:first-child,table.cmp th:first-child{text-align:left}
table.cmp tr.lead td{font-weight:600}
.scroll{overflow-x:auto}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.steps span{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--bg);color:var(--muted)}
.steps span.ok{background:var(--accent-soft);color:var(--accent);font-weight:600}
.sec{font-size:13px;font-weight:700;margin:16px 0 8px;color:var(--ink)}
.slot{margin-bottom:8px}
.slot .sl{font-size:11px;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em}
.dose{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;border-radius:12px;background:var(--bg);margin-bottom:6px;transition:background .15s}
.dose .ck{width:26px;height:26px;flex:none;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:800;color:#fff}
.dose .dn{flex:1;font-size:15px}.dose .dn em{font-style:normal;color:var(--muted);font-size:13px}
.dose .ds{font-size:12px;color:var(--muted);white-space:nowrap}
.dose.taken,.dose.taken_late{background:var(--accent-soft)}
.dose.taken .ck,.dose.taken_late .ck{background:var(--accent);border-color:var(--accent)}
.dose.taken_late .ds{color:var(--warm)}
.dose.skipped{opacity:.6}.dose.skipped .ck{background:var(--muted);border-color:var(--muted)}
.dose.overdue .ds{color:var(--warm);font-weight:600}
.mtypes{display:flex;gap:6px;margin-bottom:8px}
.mtypes button{flex:1;padding:7px 0;border-radius:10px;background:var(--bg);font-size:13px}
.mtypes button.on{background:var(--deep);color:#fff;font-weight:600}
.mline{display:flex;gap:8px;align-items:center}
.mline input{flex:1;min-width:0;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
.rates{display:flex;gap:4px}.rates button{font-size:22px;width:38px;height:42px;border-radius:10px;background:var(--bg)}
.btn.sm{width:auto;padding:9px 14px;font-size:14px}
.list{list-style:none;margin-top:8px}
.list li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.list li i{font-style:normal;color:var(--muted);font-size:12px}
.tag{font-style:normal;font-size:11px;padding:1px 7px;border-radius:99px;background:var(--accent-soft);color:var(--accent);margin-right:4px}
.x{color:var(--muted);font-size:18px;padding:0 6px}
.medrow{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.medrow:first-of-type{border-top:0}
.medact{display:flex;gap:6px;align-items:center}.medact .x{font-size:13px}
.mform{margin-top:12px;display:grid;gap:10px;background:var(--bg);padding:12px;border-radius:14px}
.mform label{display:grid;gap:4px;font-size:12px;color:var(--muted)}
.mform input:not([type=checkbox]){font:inherit;font-size:16px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.flab{font-size:12px;color:var(--muted)}
.fslot{display:flex;justify-content:space-between;align-items:center}
.fslot .chk{display:flex;flex-direction:row;align-items:center;gap:8px;font-size:15px;color:var(--ink)}
.fslot input[type=time]{width:130px}
details.card summary{font-size:14px}
details.ci > summary{list-style:none;cursor:pointer}
details.ci > summary::-webkit-details-marker{display:none}
details.ci > summary h3{margin-bottom:8px}

.banner{position:relative;margin:calc(-1 * (env(safe-area-inset-top) + 18px)) -16px 14px;padding:calc(env(safe-area-inset-top) + 22px) 18px 34px;
  background:radial-gradient(120% 90% at 85% 0%,#2A9D8F 0%,transparent 60%),linear-gradient(160deg,#0B3954 0%,#0E5E73 55%,#0E7C86 100%);
  display:flex;align-items:center;gap:12px;color:#fff;overflow:hidden}
.banner .logo{width:58px;height:58px;flex:none;border-radius:50%;background:rgba(255,255,255,.12);box-shadow:0 0 0 2px rgba(244,213,141,.55),0 6px 18px rgba(0,0,0,.25);display:grid;place-items:center}
.banner .logo svg{width:50px;height:50px;animation:swim 6s ease-in-out infinite}
@keyframes swim{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-3px) rotate(4deg)}}
.banner .kicker{font:700 11px/1 -apple-system,sans-serif;letter-spacing:.28em;text-transform:uppercase;color:var(--sand)}
.banner .brand{font:800 25px/1.05 "Avenir Next","SF Pro Rounded",-apple-system,sans-serif;letter-spacing:-.01em;margin-top:4px;
  background:linear-gradient(100deg,#fff 0%,#fff 40%,#F4D58D 50%,#fff 60%,#fff 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 7s linear infinite}
@keyframes shine{0%{background-position:150% 0}100%{background-position:-100% 0}}
.banner .vchip{position:absolute;top:calc(env(safe-area-inset-top) + 12px);right:14px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:rgba(255,255,255,.16);color:#fff}
.banner .wave{position:absolute;left:0;bottom:-1px;width:100%;height:26px}
.login .banner{margin:0 -16px;border-radius:0 0 28px 28px}
.banner .logo{width:64px;height:64px;position:relative;background:none;box-shadow:none}
.banner .logo img{width:64px;height:64px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 3px var(--sand),0 8px 20px rgba(0,0,0,.35)}
.banner .tbadge{position:absolute;right:-8px;bottom:-6px;width:32px;height:32px;border-radius:50%;background:#0B3954;box-shadow:0 0 0 2px var(--sand);display:grid;place-items:center}
.banner .tbadge svg{width:28px;height:28px;animation:swim 6s ease-in-out infinite}
.banner .logo > svg{display:none}
@media (prefers-reduced-motion:reduce){.banner .tbadge svg,.banner .brand{animation:none}}
.hero{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.wpill{flex:none;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 12px;text-align:right;min-width:112px}
.wpill .wv{font:700 20px/1.1 -apple-system,sans-serif;font-variant-numeric:tabular-nums}
.wpill .wv small{font-size:12px;color:var(--muted);font-weight:500;margin-left:2px}
.wpill .wl{font-size:11px;color:var(--muted);margin-top:2px}
.wpill .wc{font-size:11px;font-weight:600;color:var(--accent);margin-top:2px}
.wpill .wn{font-size:11px;color:var(--warm);margin-top:2px}
.sleeptop{display:flex;gap:14px;align-items:center}
.ring{position:relative;width:104px;height:104px;flex:none}
.ring svg{width:104px;height:104px;transform:rotate(-90deg)}
.ring .rv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .rv b{font:700 22px/1 -apple-system,sans-serif;font-variant-numeric:tabular-nums}
.ring .rv span{font-size:11px;color:var(--muted);margin-top:3px}
.bw{flex:1;display:grid;gap:8px}
.bw div{background:var(--bg);border-radius:12px;padding:8px 10px;display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.bw b{font-size:17px;font-variant-numeric:tabular-nums}
.bw span{font-size:11px;color:var(--muted)}
.tl{margin-top:14px}
.tl .hdr,.tl .r{display:grid;grid-template-columns:38px 1fr 40px;gap:8px;align-items:center}
.tl .hdr{font-size:10px;color:var(--muted);margin-bottom:4px}
.tl .ax{position:relative;height:12px}
.tl .ax i{position:absolute;transform:translateX(-50%);font-style:normal}
.tl .r{height:22px}
.tl .d{font-size:12px;color:var(--muted)}
.tl .tr{position:relative;height:12px;background:var(--bg);border-radius:6px}
.tl .tr .b{position:absolute;top:0;height:12px;border-radius:6px;background:#9FD3CF}
.tl .tr .b.ok{background:var(--accent)}
.tl .tr .b.est{background:repeating-linear-gradient(45deg,#cfe5e3 0 4px,#e6f2f1 4px 8px)}
.tl .tr .u{position:absolute;top:-3px;bottom:-3px;border-left:1.5px dashed var(--warm);opacity:.7}
.tl .v{font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
.tl .v.ok{color:var(--accent);font-weight:700}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}

.hero .hello{font-size:26px}
.me{margin-top:8px;font-size:13px;font-weight:600;color:var(--accent)}
.wcard{margin:0;padding:12px}
.wcard .big{font-size:24px}
.wcard svg{display:block;margin-top:6px;width:100%}
.h3r{float:right;text-transform:none;letter-spacing:0;font-weight:500}
.goalbar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:10px 0 2px}
.goalbar i{display:block;height:100%;background:var(--accent);border-radius:8px}
.times{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.times div{background:var(--bg);border-radius:12px;padding:10px}
.times b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.times span{font-size:12px;color:var(--muted)}
.chip.warm{background:var(--warm-soft);color:var(--down)}
.chip.neutral{background:var(--bg);color:var(--muted)}
.msg{font-size:14px;margin-top:10px;line-height:1.45}
.warmtxt{color:var(--warm);font-weight:600}
td.minibar{width:60px}
td.minibar i{display:block;height:6px;border-radius:6px;background:var(--accent-soft)}
td.minibar i.ok{background:var(--accent)}
details{margin-top:12px}
summary{font-size:13px;color:var(--accent);cursor:pointer;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--bg);border-radius:12px;padding:10px}
.tile span{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
.tile b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.tile b small{font-size:12px;color:var(--muted);font-weight:500;margin-left:2px}
.tile em{font-style:normal;font-size:11px;color:var(--muted)}
.tile .chip{margin-top:4px;font-size:11px}

table.cmp.tight{font-size:13px}
table.cmp.tight td,table.cmp.tight th{white-space:nowrap;padding-left:10px}
table.cmp.tight td:first-child,table.cmp.tight th:first-child{padding-left:0}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav class="tabs" id="tabs" hidden><div class="in">
  <button data-tab="today" class="on"><span>🏠</span>Today</button>
  <button data-tab="trends"><span>📈</span>Trends</button>
  <button data-tab="meds"><span>💊</span>Meds</button>
  <button data-tab="care"><span>🩺</span>Care</button>
  <button data-tab="me"><span>⚙️</span>Me</button>
</div></nav>

<script>

/* ---------- auth ---------- */
async function init(){
  const { data:{ session } } = await sb.auth.getSession();
  sb.auth.onAuthStateChange((_e, s) => { if (!!s?.user !== !!user) { user = s?.user || null; render(); } });
  user = session?.user || null;
  render();
}
function render(){
  if (!user) {
    $('#tabs').hidden = true;
    app.innerHTML = `<div class="login">
      ${banner()}
      <p>Your personal health command center.</p>
      <button class="btn" id="signin">Sign in with Google</button>
      <p class="ver">v${VERSION}</p></div>`;
    $('#signin').onclick = () => sb.auth.signInWithOAuth({ provider:'google', options:{ redirectTo: location.origin + location.pathname } });
    return;
  }
  $('#tabs').hidden = false;
  app.innerHTML = `
    <section class="view on" id="v-today"></section>
    <section class="view" id="v-trends"></section>
    <section class="view" id="v-meds"></section>
    <section class="view" id="v-care"></section>
    <section class="view" id="v-me"></section>`;
  showTab(location.hash.slice(1) || 'today');
}
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => { location.hash = b.dataset.tab; showTab(b.dataset.tab); });
function showTab(t){
  if (!$('#v-'+t)) t = 'today';
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab===t));
  document.querySelectorAll('section.view').forEach(v => v.classList.toggle('on', v.id==='v-'+t));
  ({today:loadToday, trends:loadTrends, meds:loadMeds, care:loadCare, me:loadMe}[t]||(()=>{}))();
  window.scrollTo(0,0);
}

/* ---------- sleep: CPAP is the duration of record; ring + Sleep Cycle for comparison/stages ---------- */
const hmm = m => m==null ? '—' : `${Math.floor(Math.round(m)/60)}:${String(Math.round(m)%60).padStart(2,'0')}`;
const hm = m => m==null ? '—' : `${Math.floor(m/60)}<small>h</small> ${String(Math.round(m%60)).padStart(2,'0')}<small>m</small>`;
function sleepNights(S, C){
  const by = {};
  for (const c of C) (by[c.night] ??= {night:c.night}).cpap = c;
  for (const s of S) (by[s.night] ??= {night:s.night})[s.source] = s;
  return Object.values(by).map(n => {
    const fb = ['oura','sleep_cycle','watch'].find(k => n[k]?.asleep_min >= 60);
    n.duration = n.cpap?.usage_hours ? Math.round(n.cpap.usage_hours*60) : (fb ? n[fb].asleep_min : null);
    n.durationSrc = n.cpap?.usage_hours ? 'cpap' : fb;
    return n;
  }).sort((a,b) => b.night.localeCompare(a.night));
}
function sleepCompare(n){
  const rows = [['oura','Oura ring'],['sleep_cycle','Sleep Cycle'],['watch','Apple Watch']].filter(([k])=>n[k]);
  if (!rows.length) return `<p class="note">No ring or Sleep Cycle data for this night.</p>`;
  return `<table class="cmp"><tr><th></th><th>Asleep</th><th>Deep</th><th>REM</th></tr>
    ${n.cpap ? `<tr class="lead"><td>CPAP (mask on)</td><td>${fmtMin(n.duration)}</td><td>—</td><td>—</td></tr>`:''}
    ${rows.map(([k,l])=>`<tr><td>${l}</td><td>${fmtMin(n[k].asleep_min)}</td><td>${n[k].deep_min!=null?n[k].deep_min+'m':'—'}</td><td>${n[k].rem_min!=null?n[k].rem_min+'m':'—'}</td></tr>`).join('')}

/* ---------- 2.0 daily check-in: meds, meals, notes ---------- */
const SLOTS = [['morning','☀️ Morning','08:00'],['midday','🌤️ Midday','12:00'],['evening','🌇 Evening','18:00'],['bedtime','🌙 Bedtime','22:00']];
const slotLabel = k => (SLOTS.find(s=>s[0]===k)||[k,k])[1];
const fmtTime = hhmm => { const [h,m] = (hhmm||'08:00').split(':').map(Number); const d = new Date(); d.setHours(h,m,0,0); return d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}); };
const minsNow = () => { const d = new Date(); return d.getHours()*60 + d.getMinutes(); };
const toMins = hhmm => { const [h,m] = (hhmm||'0:0').split(':').map(Number); return h*60+m; };
const NOTE_CATS = [['cpap',/cpap|mask|leak|airsense/i],['sleep',/sleep|tired|insomnia|nap|woke|bed/i],['pain',/pain|hurt|ache|sore|headache|migraine|knee|back|joint/i],
  ['meds',/pill|med|dose|refill|prescription/i],['exercise',/walk|ride|bike|workout|gym|swim|hike|run/i],['food',/ate|eat|food|hungry|meal|snack|drink/i],
  ['mood',/anxious|stress|sad|happy|mood|angry|calm|down/i],['energy',/energy|energetic|fatigue|sluggish|wired/i],['heart',/heart|palpitat|pulse|blood pressure|bp\b/i]];
const noteCat = t => (NOTE_CATS.find(([,re])=>re.test(t))||['general'])[0];
const MEAL_RATE = { good:'🟢', okay:'🟡', not_great:'🔴' };
const defaultMeal = () => { const h = new Date().getHours(); return h<11?'breakfast':h<15?'lunch':h<21?'dinner':'snack'; };

// expected doses per day for a med (respecting start/end dates)
const dosesOn = (med, day) => (med.active && (!med.start_date || med.start_date <= day) && (!med.end_date || med.end_date >= day)) ? (med.schedule||[]) : [];
async function adherence(days = 7){
  const today = localDay(), from = addDays(today, -(days-1));
  const [{ data: meds }, { data: ev }] = await Promise.all([
    sb.from('medication').select('id,active,schedule,start_date,end_date'),
    sb.from('medication_event').select('medication_id,day,slot,status').gte('day', from)]);
  let due = 0, done = 0; const now = minsNow();
  for (let i = 0; i < days; i++) { const d = addDays(from, i);
    for (const m of meds||[]) for (const s of dosesOn(m, d)) {
      if (d === today && toMins(s.time) > now) continue;            // not due yet
      due++; if ((ev||[]).some(e => e.medication_id===m.id && e.day===d && e.slot===s.slot && (e.status==='taken'||e.status==='taken_late'))) done++; } }
  return due ? { pct: Math.round(done/due*100), done, due } : null;
}

async function checkinCard(today){
  const [{ data: meds }, { data: ev }, { data: meals }, { data: notes }, { data: dr }] = await Promise.all([
    sb.from('medication').select('id,name,dose,schedule,start_date,end_date,active').eq('active', true).order('name'),
    sb.from('medication_event').select('id,medication_id,slot,status,marked_at').eq('day', today),
    sb.from('meal').select('id,meal_type,description,rating,logged_at').eq('day', today).order('logged_at'),
    sb.from('journal_entry').select('id,body,category,logged_at').gte('logged_at', new Date(today+'T00:00').toISOString()).order('logged_at'),
    sb.from('daily_record').select('mood,energy').eq('day', today).maybeSingle()]);
  const doses = []; for (const m of meds||[]) for (const s of dosesOn(m, today)) doses.push({ m, s, e: (ev||[]).find(e=>e.medication_id===m.id && e.slot===s.slot) });
  doses.sort((a,b)=>toMins(a.s.time)-toMins(b.s.time) || a.m.name.localeCompare(b.m.name));
  const now = minsNow();
  const dueDoses = doses.filter(d => toMins(d.s.time) <= now + 60);
  const medsDone = dueDoses.every(d => d.e);
  const mood = dr?.mood, energy = dr?.energy;
  const steps = [['Meds', !doses.length || medsDone], ['Mood', !!mood], ['Energy', !!energy], ['Meal', (meals||[]).length>0]];
  const doneN = steps.filter(s=>s[1]).length;
  const bySlot = SLOTS.map(([k,l]) => [k, l, doses.filter(d=>d.s.slot===k)]).filter(x=>x[2].length);
  const doseBtn = d => { const st = d.e?.status; const late = !st && toMins(d.s.time) + 120 < now;
    return `<button class="dose ${st||''} ${late?'overdue':''}" data-med="${d.m.id}" data-slot="${d.s.slot}" data-time="${d.s.time}" data-ev="${d.e?.id||''}" data-st="${st||''}">
      <span class="ck">${st==='taken'||st==='taken_late'?'✓':st==='skipped'?'–':''}</span>
      <span class="dn"><b>${esc(d.m.name)}</b>${d.m.dose?` <em>${esc(d.m.dose)}</em>`:''}</span>
      <span class="ds">${st==='taken'?'taken '+new Date(d.e.marked_at).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}):st==='taken_late'?'taken late':st==='skipped'?'skipped':late?'overdue':fmtTime(d.s.time)}</span></button>`; };
  const all = doneN === steps.length;
  return `<details class="card ci" id="checkin" ${all && !window.__ciOpen ? '' : 'open'}><summary><h3>✅ Today's check-in <span class="h3r">${all?'all done 🎉':doneN+' of '+steps.length+' done'}</span></h3>
    <div class="steps">${steps.map(([l,ok])=>`<span class="${ok?'ok':''}">${ok?'✓':'○'} ${l}</span>`).join('')}</div></summary>

    <div class="sec">💊 Meds</div>
    ${doses.length ? bySlot.map(([k,l,ds])=>`<div class="slot"><div class="sl">${l}</div>${ds.map(doseBtn).join('')}</div>`).join('')
      + `<p class="note">Tap = taken · tap again = skipped · again = clear</p>`
      : `<p class="note">No medications set up yet. Add them in the <b>Meds</b> tab, or pick from your MyChart list there.</p>`}

    <div class="sec">How's today?</div>
    <div class="row" id="mood">${['😫','😕','😐','🙂','😃'].map((e,i)=>`<button class="pick ${mood===i+1?'on':''}" data-v="${i+1}" aria-label="Mood ${i+1}">${e}</button>`).join('')}</div>
    <div class="sub" style="margin:10px 0 6px">Energy</div>
    <div class="row" id="energy">${[1,2,3,4,5].map(i=>`<button class="pick num ${energy===i?'on':''}" data-v="${i}">${i}</button>`).join('')}</div>

    <div class="sec">🍽️ Meals</div>
    <div class="mtypes" id="mtype">${['breakfast','lunch','dinner','snack'].map(t=>`<button data-t="${t}" class="${t===defaultMeal()?'on':''}">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div>
    <div class="mline"><input id="mdesc" placeholder="e.g. two eggs, wheat toast, coffee" maxlength="200" enterkeyhint="done">
      <div class="rates" id="mrate">${Object.entries(MEAL_RATE).map(([k,v])=>`<button data-r="${k}" aria-label="${k}">${v}</button>`).join('')}</div></div>
    ${(meals||[]).length ? `<ul class="list">${meals.map(m=>`<li><span>${MEAL_RATE[m.rating]||'⚪'} <b>${m.meal_type?m.meal_type[0].toUpperCase()+m.meal_type.slice(1):''}</b> ${esc(m.description)}</span><button class="x" data-del-meal="${m.id}" aria-label="Remove">×</button></li>`).join('')}</ul>`
      : `<p class="note">Type what you ate, then tap 🟢 good, 🟡 okay or 🔴 not great to save.</p>`}

    <div class="sec">📝 Anything else?</div>
    <div class="mline"><input id="note" placeholder="e.g. knee hurt after walking" maxlength="400" enterkeyhint="send"><button class="btn sm" id="saveNote">Save</button></div>
    ${(notes||[]).length ? `<ul class="list">${notes.map(n=>`<li><span><em class="tag">${esc(n.category||'general')}</em> ${esc(n.body)} ${n.logged_at?`<i>${new Date(n.logged_at).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}</i>`:''}</span><button class="x" data-del-note="${n.id}" aria-label="Remove">×</button></li>`).join('')}</ul>`:''}
  </details>`;
}

function wireCheckin(today){
  const card = $('#checkin'); if (!card) return;
  card.querySelector('summary').addEventListener('click', () => { window.__ciOpen = !card.open; });
  const refresh = async () => { const html = await checkinCard(today); card.outerHTML = html; wireCheckin(today); };
  const err = e => { if (e) alert('Could not save: ' + e.message); return !!e; };
  card.querySelectorAll('.dose').forEach(b => b.onclick = async () => {
    const st = b.dataset.st, id = b.dataset.ev;
    if (!st) { const late = toMins(b.dataset.time) + 120 < minsNow();
      if (err((await sb.from('medication_event').upsert({ user_id:user.id, medication_id:b.dataset.med, day:today, slot:b.dataset.slot, status: late?'taken_late':'taken', marked_at:new Date().toISOString() }, { onConflict:'user_id,medication_id,day,slot' })).error)) return; }
    else if (st==='taken' || st==='taken_late') { if (err((await sb.from('medication_event').update({ status:'skipped', marked_at:new Date().toISOString() }).eq('id', id)).error)) return; }
    else { if (err((await sb.from('medication_event').delete().eq('id', id)).error)) return; }
    refresh();
  });
  const saveDR = async (field, v, row) => {
    row.querySelectorAll('.pick').forEach(x=>x.classList.toggle('on', +x.dataset.v===v));
    err((await sb.from('daily_record').upsert({ user_id:user.id, day:today, [field]:v, updated_at:new Date().toISOString() }, { onConflict:'user_id,day' })).error);
    refresh();
  };
  $('#mood').onclick = e => { const x=e.target.closest('.pick'); if(x) saveDR('mood', +x.dataset.v, $('#mood')); };
  $('#energy').onclick = e => { const x=e.target.closest('.pick'); if(x) saveDR('energy', +x.dataset.v, $('#energy')); };
  $('#mtype').onclick = e => { const x=e.target.closest('button'); if(!x) return; $('#mtype').querySelectorAll('button').forEach(y=>y.classList.toggle('on', y===x)); };
  $('#mrate').onclick = async e => { const x=e.target.closest('button'); if(!x) return; const d = $('#mdesc').value.trim();
    if (!d) { $('#mdesc').focus(); $('#mdesc').placeholder = 'Type the meal first, then tap a color'; return; }
    const t = $('#mtype').querySelector('.on')?.dataset.t || defaultMeal();
    if (err((await sb.from('meal').insert({ user_id:user.id, day:today, meal_type:t, description:d, rating:x.dataset.r })).error)) return; refresh(); };
  const saveNote = async () => { const t = $('#note').value.trim(); if (!t) return;
    if (err((await sb.from('journal_entry').insert({ user_id:user.id, body:t, category:noteCat(t) })).error)) return; refresh(); };
  $('#saveNote').onclick = saveNote; $('#note').onkeydown = e => { if (e.key==='Enter') saveNote(); };
  card.querySelectorAll('[data-del-meal]').forEach(b => b.onclick = async () => { if (!err((await sb.from('meal').delete().eq('id', b.dataset.delMeal)).error)) refresh(); });
  card.querySelectorAll('[data-del-note]').forEach(b => b.onclick = async () => { if (!err((await sb.from('journal_entry').delete().eq('id', b.dataset.delNote)).error)) refresh(); });
}

const median = a => { if (!a.length) return null; const s = [...a].sort((x,y)=>x-y), m = Math.floor(s.length/2); return s.length%2 ? s[m] : (s[m-1]+s[m])/2; };

function sparkSvg(vals, w=120, h=34){
  if (vals.length < 2) return '';
  const mn = Math.min(...vals), mx = Math.max(...vals), r = (mx-mn)||1;

  const avg7 = avg(last7.map(n=>n.duration)), hit7 = last7.filter(n=>n.duration>=SLEEP_TARGET).length;
  const timed = N.map(n=>({n, t:timing(n)})).filter(x=>x.t);
  const usualBed = median(timed.map(x=>sinceSix(x.t.bedtime))), usualWake = median(timed.filter(x=>x.t.wake_time).map(x=>sinceSix(x.t.wake_time)));
  const lt = lastN && timing(lastN);
  const tag = (m, usual, laterWord, earlierWord) => (m==null||usual==null) ? '' : m-usual > 45 ? `<span class="chip warm">${laterWord}</span>` : usual-m > 45 ? `<span class="chip">${earlierWord}</span>` : '';
  const pctT = lastN?.duration ? Math.min(100, Math.round(lastN.duration/SLEEP_TARGET*100)) : 0;
  const week = N.filter(n => n.night > addDays(today,-7)).slice(0,7);
  const ring = (min) => { const p = Math.min(1, (min||0)/SLEEP_TARGET), C = 2*Math.PI*44;
    return `<div class="ring"><svg viewBox="0 0 104 104"><circle cx="52" cy="52" r="44" fill="none" stroke="var(--accent-soft)" stroke-width="10"/>
      <circle cx="52" cy="52" r="44" fill="none" stroke="${p>=1?'var(--accent)':'#3FA7A0'}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${(p*C).toFixed(1)} ${C.toFixed(1)}"/></svg>
      <div class="rv"><b>${hmm(min)}</b><span>${p>=1?'goal met 🎉':Math.round(p*100)+'% of 7h'}</span></div></div>`; };
  // timeline: x axis 8 PM (120 after 6 PM) → 11 AM (1020)
  const X0 = 120, X1 = 1020, xp = m => Math.max(0, Math.min(100, (m - X0) / (X1 - X0) * 100));
  const tlRows = week.map(n => {
    const t = timing(n), ok = (n.duration||0) >= SLEEP_TARGET;
    let bar = '';
    if (t?.bedtime && t?.wake_time) { const b0 = sinceSix(t.bedtime), b1 = sinceSix(t.wake_time); bar = `<div class="b ${ok?'ok':''}" style="left:${xp(b0)}%;width:${Math.max(2, xp(b1)-xp(b0))}%" title="${clock(t.bedtime)} – ${clock(t.wake_time)}"></div>`; }
    else if (n.duration && usualWake!=null) { const b1 = usualWake, b0 = b1 - n.duration; bar = `<div class="b est" style="left:${xp(b0)}%;width:${Math.max(2, xp(b1)-xp(b0))}%" title="No bed/wake times — placed at your usual wake time"></div>`; }
    return `<div class="r"><span class="d">${new Date(n.night+'T12:00').toLocaleDateString('en-US',{weekday:'short'})}</span>
      <div class="tr">${usualBed!=null?`<span class="u" style="left:${xp(usualBed)}%"></span>`:''}${usualWake!=null?`<span class="u" style="left:${xp(usualWake)}%"></span>`:''}${bar}</div>
      <span class="v ${ok?'ok':''}">${hmm(n.duration)}</span></div>`; }).join('');
  const axis = [[180,'9p'],[360,'12a'],[540,'3a'],[720,'6a'],[900,'9a']].map(([m,l])=>`<i style="left:${xp(m)}%">${l}</i>`).join('');
  const sleepCard = `<div class="card"><h3>😴 Sleep <span class="h3r">goal 7h</span></h3>
    ${lastN ? `
      <div class="sleeptop">${ring(lastN.duration)}

  // ----- move -----

  const minMsg = (prA.length && wkA.length) ? (m7===mP ? `💪 <b>${fmtNum(m7)} active minutes</b> this week — matching the week before.` : m7>mP ? `💪 <b>${fmtNum(m7-mP)} more active minutes</b> than the week before (${fmtNum(m7)} vs ${fmtNum(mP)}).` : `${fmtNum(m7)} active minutes this week vs ${fmtNum(mP)} the week before — one bike ride evens it up.`) : '';
  const WK = wk.data||[];

  // ----- heart -----

  const base = k => avg(Hd.filter(r=>r[k]!=null).slice(1).map(r=>+r[k]));     // 30-day baseline, excluding latest
  const chip = (v, b, lowerIsBetter, unit) => { if (v==null||b==null) return ''; const d = +v - b; if (Math.abs(d) < (unit==='%'?0.5:1)) return `<span class="chip neutral">at your usual</span>`;
    const good = lowerIsBetter ? d<0 : d>0; return `<span class="chip ${good?'':'neutral'}">${d<0?'↓':'↑'} ${Math.abs(d).toFixed(unit==='%'?1:0)} vs usual</span>`; };
  const rhr = latest('resting_hr'), hrv = latest('hrv_sdnn'), mx = latest('hr_max'), o2 = latest('spo2_pct');
  const tile = (label, r, k, unit, lowerBetter, digits=0) => `<div class="tile"><span>${label}</span><b>${r?(+r[k]).toFixed(digits):'—'}<small>${unit}</small></b>
    ${r && lowerBetter!==null ? chip(r[k], base(k), lowerBetter, unit) : r ? `<em>${new Date(r.day+'T12:00').toLocaleDateString('en-US',{month:'short',day:'numeric'})}</em>`:''}</div>`;
  const heartCard = `<div class="card"><h3>❤️ Heart</h3>
    <div class="tiles">${tile('Resting HR', rhr, 'resting_hr', 'bpm', true)}${tile('HRV', hrv, 'hrv_sdnn', 'ms', false)}
      ${tile('Max HR', mx, 'hr_max', 'bpm', null)}${tile('Blood O₂', o2, 'spo2_pct', '%', false, 1)}</div>
    <p class="note">"Usual" = your 30-day average. Blood O₂ comes from your Apple Watch.</p></div>`;

  const ci = await checkinCard(today);
  el.querySelector('.empty').outerHTML = `
    <div class="hero"><div><div class="hello">${greet}${name?', '+esc(name):''}</div>
      <div class="date">${new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}</div>
      <div class="me">${ageFrom(DOB)} yrs${heightTxt?` · ${heightTxt}`:''}</div></div>${weightCard}</div>
    ${ci}${sleepCard}${moveCard}${heartCard}
    <p class="note">Not medical advice. Check with your care team about anything that concerns you.</p>`;
  wireCheckin(today);
}

    </table></div><p class="note">"vs CPAP" compares the same nights only. Mask-on time includes time awake with the mask on, so the ring and Sleep Cycle usually read lower.</p>`:''}

  const recent = N.slice(-14).reverse();

  const stv = (st.data||[]).map(r=>+r.value);

    `<div class="card"><h3>🚶 Steps · last 30 days</h3>${stv.length?`<div class="big">${fmtNum(avg(stv))}</div><div class="sub">average · ${stv.length} days</div>${spark(stv)}`:'<p class="empty">No data yet</p>'}</div>` +

async function refreshCounts(){

function parseCSV(text){
  const rows=[]; let row=[], f='', q=false;
  for (let i=0;i<text.length;i++){
    const c=text[i];
    if (q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if (c==='"') q=true;
    else if (c===','){ row.push(f); f=''; }
    else if (c==='\n'){ row.push(f.replace(/\r$/,'')); rows.push(row); row=[]; f=''; }
    else f+=c;
  }
  if (f || row.length){ row.push(f); rows.push(row); }
  const head = rows.shift() || [];
  return rows.filter(r=>r.length>1).map(r => Object.fromEntries(head.map((h,i)=>[h, r[i]])));
}
const nul = v => (v===undefined || v==='' ) ? null : v;
const num = v => nul(v)==null ? null : +v;
const bool = v => v==='True' || v==='true';
function shape(kind, rows){
  switch(kind){
    case 'health_metric': return rows.map(r=>({day:r.day, metric:r.metric, source:r.source, value:+r.value, unit:nul(r.unit), is_primary:bool(r.is_primary)}));
    case 'sleep_night': return rows.map(r=>({night:r.night, source:r.source, bedtime:nul(r.bedtime), wake_time:nul(r.wake_time),
      in_bed_min:num(r.in_bed_min), asleep_min:num(r.asleep_min), awake_min:num(r.awake_min), deep_min:num(r.deep_min), rem_min:num(r.rem_min), core_min:num(r.core_min), is_primary:bool(r.is_primary)}));
    case 'body_measurement': return rows.map(r=>({measured_at:r.measured_at, kind:r.kind, value:+r.value, value2:num(r.value2), unit:nul(r.unit), source:r.source}));
    case 'workout': return rows.map(r=>({started_at:r.started_at, activity:r.activity, duration_min:num(r.duration_min), distance_mi:num(r.distance_mi), active_kcal:num(r.active_kcal), source:nul(r.source)}));
    // cpap_session.csv 'night' column holds the myAir session date (evening); wake date = +1
    case 'cpap_session': return rows.map(r=>{ const sd = r.session_date || r.night; return {night:addDays(sd,1), session_date:sd, usage_hours:num(r.usage_hours), ahi:num(r.ahi), leak_50:num(r.leak_50), leak_95:num(r.leak_95), myair_score:num(r.myair_score), mask_on_off:num(r.mask_on_off), mode:nul(r.mode)}; });
    case 'myair_raw': {
      const by = {};
      for (const r of rows){ if (r.EVENTNAME==='REMOVE' || !r.SESSION_DATE) continue;
        const o = by[r.SESSION_DATE]; if (!o || (r.APPROXIMATECREATIONDATETIME||'') > (o.APPROXIMATECREATIONDATETIME||'')) by[r.SESSION_DATE]=r; }
      return Object.values(by).map(r=>({night:addDays(r.SESSION_DATE,1), session_date:r.SESSION_DATE, usage_hours:num(r.USAGE_HOURS)!=null?Math.round(r.USAGE_HOURS*100)/100:null, ahi:num(r.AHI), leak_50:num(r.LEAK_50_PERCENTILE), leak_95:num(r.LEAK_95_PERCENTILE), myair_score:num(r.SLEEP_SCORE), mask_on_off:num(r.MASK_SESSION_COUNT), mode:nul(r.MODE)}));
    }
  }
}
const CONFLICT = {health_metric:'user_id,day,metric,source', sleep_night:'user_id,night,source', workout:'user_id,started_at,activity', cpap_session:'user_id,night', clinical_record:'user_id,resource_type,resource_id', body_measurement:'user_id,kind,measured_at,source'};
function kindOf(name, firstLine){
  if (/SESSION_DATE/.test(firstLine)) return 'myair_raw';
  for (const k of ['health_metric','sleep_night','workout','cpap_session','clinical_record','body_measurement']) if (name.startsWith(k)) return k;
  return null;
}
async function runImport(files){
  const log = $('#log'), bar = $('#bar'); log.hidden = bar.hidden = false; log.textContent = '';
  const say = s => { log.textContent += s + '\n'; log.scrollTop = log.scrollHeight; };
  const setBar = p => bar.firstElementChild.style.width = (p*100).toFixed(1)+'%';
  for (const file of files){
    const text = await file.text();
    const kind = kindOf(file.name, text.slice(0, 2000));
    if (!kind){ say(`⚠️ ${file.name}: not recognized, skipped`); continue; }
    let rows;
    if (kind==='clinical_record') rows = text.split('\n').filter(Boolean).map(l=>JSON.parse(l));
    else rows = shape(kind, parseCSV(text));
    const table = kind==='myair_raw' ? 'cpap_session' : kind;
    { const keys = CONFLICT[table].split(',').filter(k=>k!=='user_id'), m = new Map();
      for (const r of rows) m.set(keys.map(k=>r[k]).join('|'), r);   // last copy wins; avoids duplicate keys in one batch
      rows = [...m.values()]; }
    const dates = rows.map(r=>r.day||r.night||r.recorded_on||(r.started_at||r.measured_at||'').slice(0,10)).filter(Boolean).sort();
    const { data: batch, error: be } = await sb.from('import_batch').insert({ user_id:user.id, source: kind==='myair_raw'?'myair':'apple_health_export', file_name:file.name, record_count:rows.length, date_from:dates[0]||null, date_to:dates.at(-1)||null, status:'running' }).select('id').single();
    if (be){ say(`❌ ${file.name}: ${be.message}`); continue; }
    say(`${file.name} → ${table}: ${rows.length.toLocaleString()} rows`);
    const size = table==='clinical_record' ? 100 : 1000; let done = 0, failed = 0;
    for (let i=0;i<rows.length;i+=size){
      const chunk = rows.slice(i,i+size).map(r=>({...r, user_id:user.id, import_batch_id:batch.id}));
      let { error } = await sb.from(table).upsert(chunk, { onConflict: CONFLICT[table] });
      if (error){ await new Promise(r=>setTimeout(r,1200)); ({ error } = await sb.from(table).upsert(chunk, { onConflict: CONFLICT[table] })); }
      if (error){ failed += chunk.length; say(`  ❌ rows ${i}–${i+chunk.length}: ${error.message}`); }
      done += chunk.length; setBar(done/rows.length);
    }
    await sb.from('import_batch').update({ status: failed ? 'partial' : 'done' }).eq('id', batch.id);
    say(failed ? `  ⚠️ done with ${failed} failed rows` : `  ✅ done`);
  }
  say('Finished.'); refreshCounts();
}
