<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Operation: Outlive the Group Chat</title>
<meta name="theme-color" content="#F4F1EA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Outlive">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#F4F1EA; --card:#FFFDF8; --ink:#1F2A2E; --muted:#6B7478; --line:#E4DED2;
  --accent:#2F6F62; --accent-soft:#DCEBE6; --warm:#C9833A; --warm-soft:#F5E6D3; --down:#9A5B4A;
  --r:18px; --safe-b:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(96px + var(--safe-b))}
header.top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:18px}
.hello{font:600 28px/1.1 "New York","Iowan Old Style",Georgia,serif;letter-spacing:-.01em}
.date{color:var(--muted);font-size:14px;margin-top:4px}
.ver{font-size:11px;color:var(--muted)}
.apptitle{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.apptitle span{font-weight:500;color:var(--muted);letter-spacing:0;text-transform:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card h3{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.grid .card{margin:0}
.big{font:600 30px/1 "SF Pro Rounded",-apple-system,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.big small{font-size:15px;font-weight:500;color:var(--muted);margin-left:2px}
.sub{font-size:13px;color:var(--muted);margin-top:6px}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.chip.dn{background:var(--warm-soft);color:var(--down)}
.src{font-size:11px;color:var(--muted);margin-top:8px}
.row{display:flex;gap:8px}
.pick{flex:1;padding:10px 0;border-radius:12px;background:var(--bg);font-size:22px;transition:transform .1s}
.pick.num{font-size:17px;font-weight:600}
.pick.on{background:var(--accent);color:#fff;transform:scale(1.04)}
.pick:active{transform:scale(.96)}
.empty{color:var(--muted);font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:14px;background:var(--accent);color:#fff;font-weight:600;width:100%}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(255,253,248,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:var(--safe-b)}
nav.tabs .in{display:flex;max-width:560px;width:100%}
nav.tabs button{flex:1;padding:9px 0 8px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button span{font-size:21px;filter:grayscale(1);opacity:.6}
nav.tabs button.on{color:var(--accent);font-weight:600}
nav.tabs button.on span{filter:none;opacity:1}
section.view{display:none}
section.view.on{display:block}
.soon{text-align:center;padding:40px 16px;color:var(--muted)}
.soon b{display:block;font:600 20px "New York",Georgia,serif;color:var(--ink);margin-bottom:6px}
.login{min-height:80vh;display:flex;flex-direction:column;justify-content:center;gap:16px;text-align:center}
.login h1{font:600 34px/1.1 "New York",Georgia,serif}
.login p{color:var(--muted)}
.files label{display:block;border:1.5px dashed var(--line);border-radius:14px;padding:18px;text-align:center;color:var(--muted);cursor:pointer}
.files input{display:none}
.log{font:12px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap;background:var(--bg);border-radius:12px;padding:10px;margin-top:10px;max-height:260px;overflow:auto}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
table.counts{width:100%;font-size:14px;border-collapse:collapse}
table.counts td{padding:6px 0;border-bottom:1px solid var(--line)}
table.counts td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.spark{display:flex;align-items:flex-end;gap:3px;height:44px;margin-top:10px}
.spark i{flex:1;background:var(--accent-soft);border-radius:3px 3px 0 0;min-height:2px}
.spark i.last{background:var(--accent)}
.note{font-size:12px;color:var(--muted);margin-top:10px}
table.cmp{width:100%;border-collapse:collapse;font-size:14px;margin-top:12px;font-variant-numeric:tabular-nums}
table.cmp th{font-size:11px;font-weight:600;color:var(--muted);text-align:right;padding:4px 0;text-transform:uppercase;letter-spacing:.04em}
table.cmp td{padding:7px 0;border-top:1px solid var(--line);text-align:right}
table.cmp td:first-child,table.cmp th:first-child{text-align:left}
table.cmp tr.lead td{font-weight:600}
.scroll{overflow-x:auto}
.hero{display:grid;grid-template-columns:1fr 160px;gap:12px;align-items:start;margin-bottom:12px}
.hero .hello{font-size:26px}
.me{margin-top:8px;font-size:13px;font-weight:600;color:var(--accent)}
.wcard{margin:0;padding:12px}
.wcard .big{font-size:24px}
.wcard svg{display:block;margin-top:6px;width:100%}
.h3r{float:right;text-transform:none;letter-spacing:0;font-weight:500}
.goalbar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:10px 0 2px}
.goalbar i{display:block;height:100%;background:var(--accent);border-radius:8px}
.times{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.times div{background:var(--bg);border-radius:12px;padding:10px}
.times b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.times span{font-size:12px;color:var(--muted)}
.chip.warm{background:var(--warm-soft);color:var(--down)}
.chip.neutral{background:var(--bg);color:var(--muted)}
.msg{font-size:14px;margin-top:10px;line-height:1.45}
.warmtxt{color:var(--warm);font-weight:600}
td.minibar{width:60px}
td.minibar i{display:block;height:6px;border-radius:6px;background:var(--accent-soft)}
td.minibar i.ok{background:var(--accent)}
details{margin-top:12px}
summary{font-size:13px;color:var(--accent);cursor:pointer;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--bg);border-radius:12px;padding:10px}
.tile span{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
.tile b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.tile b small{font-size:12px;color:var(--muted);font-weight:500;margin-left:2px}
.tile em{font-style:normal;font-size:11px;color:var(--muted)}
.tile .chip{margin-top:4px;font-size:11px}

table.cmp.tight{font-size:13px}
table.cmp.tight td,table.cmp.tight th{white-space:nowrap;padding-left:10px}
table.cmp.tight td:first-child,table.cmp.tight th:first-child{padding-left:0}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav class="tabs" id="tabs" hidden><div class="in">
  <button data-tab="today" class="on"><span>🏠</span>Today</button>
  <button data-tab="trends"><span>📈</span>Trends</button>
  <button data-tab="meds"><span>💊</span>Meds</button>
  <button data-tab="care"><span>🩺</span>Care</button>
  <button data-tab="me"><span>⚙️</span>Me</button>
</div></nav>

<script>
const VERSION = '1.5';
const SB_URL = 'https://wwmcugtxyuvkxwurirgu.supabase.co';
const SB_KEY = 'sb_publishable_uQJ27EvPPtgnBLLLdX5HZA_Q96ho4ZZ';
const sb = window.supabase.createClient(SB_URL, SB_KEY);
let user = null;
const $ = (s, el=document) => el.querySelector(s);
const app = $('#app');
const localDay = (d=new Date()) => d.toLocaleDateString('en-CA');
const addDays = (s, n) => { const d = new Date(s+'T12:00:00'); d.setDate(d.getDate()+n); return localDay(d); };
const fmtMin = m => m==null ? '—' : `${Math.floor(m/60)}h ${String(Math.round(m%60)).padStart(2,'0')}m`;
const fmtNum = n => n==null ? '—' : Math.round(n).toLocaleString();
const avg = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : null;
const SRC = {oura:'Oura', sleep_cycle:'Sleep Cycle', watch:'Apple Watch', iphone:'iPhone', withings:'Withings', manual:'Manual', omron:'OMRON'};
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- auth ---------- */
async function init(){
  const { data:{ session } } = await sb.auth.getSession();
  sb.auth.onAuthStateChange((_e, s) => { if (!!s?.user !== !!user) { user = s?.user || null; render(); } });
  user = session?.user || null;
  render();
}
function render(){
  if (!user) {
    $('#tabs').hidden = true;
    app.innerHTML = `<div class="login">
      <h1>Operation: Outlive<br>the Group Chat</h1>
      <p>Your personal health command center.</p>
      <button class="btn" id="signin">Sign in with Google</button>
      <p class="ver">v${VERSION}</p></div>`;
    $('#signin').onclick = () => sb.auth.signInWithOAuth({ provider:'google', options:{ redirectTo: location.origin + location.pathname } });
    return;
  }
  $('#tabs').hidden = false;
  app.innerHTML = `
    <section class="view on" id="v-today"></section>
    <section class="view" id="v-trends"></section>
    <section class="view" id="v-meds"><div class="soon"><b>Meds</b>Medication list, one-tap tracking and adherence arrive in Phase 3.</div></section>
    <section class="view" id="v-care"></section>
    <section class="view" id="v-me"></section>`;
  showTab(location.hash.slice(1) || 'today');
}
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => { location.hash = b.dataset.tab; showTab(b.dataset.tab); });
function showTab(t){
  if (!$('#v-'+t)) t = 'today';
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab===t));
  document.querySelectorAll('section.view').forEach(v => v.classList.toggle('on', v.id==='v-'+t));
  ({today:loadToday, trends:loadTrends, care:loadCare, me:loadMe}[t]||(()=>{}))();
  window.scrollTo(0,0);
}

/* ---------- sleep: CPAP is the duration of record; ring + Sleep Cycle for comparison/stages ---------- */
const hmm = m => m==null ? '—' : `${Math.floor(Math.round(m)/60)}:${String(Math.round(m)%60).padStart(2,'0')}`;
const hm = m => m==null ? '—' : `${Math.floor(m/60)}<small>h</small> ${String(Math.round(m%60)).padStart(2,'0')}<small>m</small>`;
function sleepNights(S, C){
  const by = {};
  for (const c of C) (by[c.night] ??= {night:c.night}).cpap = c;
  for (const s of S) (by[s.night] ??= {night:s.night})[s.source] = s;
  return Object.values(by).map(n => {
    const fb = ['oura','sleep_cycle','watch'].find(k => n[k]?.asleep_min >= 60);
    n.duration = n.cpap?.usage_hours ? Math.round(n.cpap.usage_hours*60) : (fb ? n[fb].asleep_min : null);
    n.durationSrc = n.cpap?.usage_hours ? 'cpap' : fb;
    return n;
  }).sort((a,b) => b.night.localeCompare(a.night));
}
function sleepCompare(n){
  const rows = [['oura','Oura ring'],['sleep_cycle','Sleep Cycle'],['watch','Apple Watch']].filter(([k])=>n[k]);
  if (!rows.length) return `<p class="note">No ring or Sleep Cycle data for this night.</p>`;
  return `<table class="cmp"><tr><th></th><th>Asleep</th><th>Deep</th><th>REM</th></tr>
    ${n.cpap ? `<tr class="lead"><td>CPAP (mask on)</td><td>${fmtMin(n.duration)}</td><td>—</td><td>—</td></tr>`:''}
    ${rows.map(([k,l])=>`<tr><td>${l}</td><td>${fmtMin(n[k].asleep_min)}</td><td>${n[k].deep_min!=null?n[k].deep_min+'m':'—'}</td><td>${n[k].rem_min!=null?n[k].rem_min+'m':'—'}</td></tr>`).join('')}
  </table><p class="note">Ring and Sleep Cycle sleep is an estimate; deep and REM are estimates.</p>`;
}

async function latestWeight(){
  const b = (await sb.from('body_measurement').select('measured_at,value,source').eq('kind','weight').order('measured_at',{ascending:false}).limit(1)).data?.[0];
  if (b) return { day: localDay(new Date(b.measured_at)), value: b.value, source: b.source };
  return (await sb.from('health_metric').select('day,value,source').eq('metric','weight_lb').eq('is_primary',true).order('day',{ascending:false}).limit(1)).data?.[0];
}

/* ---------- today ---------- */
const DOB = '1971-01-05', SLEEP_TARGET = 420;     // 7 h
const ageFrom = dob => { const b = new Date(dob+'T12:00'), n = new Date(); let a = n.getFullYear()-b.getFullYear();
  if (n.getMonth()<b.getMonth() || (n.getMonth()===b.getMonth() && n.getDate()<b.getDate())) a--; return a; };
const clock = iso => iso ? new Date(iso).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}) : '—';
const sinceSix = iso => { const d = new Date(iso); return ((d.getHours()*60+d.getMinutes()) - 1080 + 1440) % 1440; };  // minutes after 6 PM
const clockFromSix = m => { const t = (m + 1080) % 1440, h = Math.floor(t/60), mm = Math.round(t%60); const d = new Date(); d.setHours(h, mm, 0, 0); return d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}); };
const median = a => { if (!a.length) return null; const s = [...a].sort((x,y)=>x-y), m = Math.floor(s.length/2); return s.length%2 ? s[m] : (s[m-1]+s[m])/2; };
const shortDay = d => new Date(d+'T12:00').toLocaleDateString('en-US',{weekday:'short',month:'numeric',day:'numeric'});
const timing = n => n.oura?.bedtime ? n.oura : n.sleep_cycle?.bedtime ? n.sleep_cycle : n.watch?.bedtime ? n.watch : null;   // who tracked bed/wake times
function sparkSvg(vals, w=120, h=34){
  if (vals.length < 2) return '';
  const mn = Math.min(...vals), mx = Math.max(...vals), r = (mx-mn)||1;
  const pts = vals.map((v,i)=>`${(i/(vals.length-1)*(w-4)+2).toFixed(1)},${(h-3-(v-mn)/r*(h-6)).toFixed(1)}`).join(' ');
  const last = pts.split(' ').at(-1).split(',');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${last[0]}" cy="${last[1]}" r="3" fill="var(--accent)"/></svg>`;
}

async function loadToday(){
  const el = $('#v-today'), today = localDay(), h = new Date().getHours();
  const greet = h<12 ? 'Good morning' : h<17 ? 'Good afternoon' : 'Good evening';
  const name = (user.user_metadata?.full_name || '').split(' ')[0] || '';
  el.innerHTML = `<div class="apptitle">Operation: Outlive the Group Chat<span>v${VERSION}</span></div><div class="empty">Loading…</div>`;
  const from30 = addDays(today,-31), from15 = addDays(today,-15);
  const [sleep, cpap, act, heart, wk, wts, ht, dr] = await Promise.all([
    sb.from('sleep_night').select('night,source,asleep_min,deep_min,rem_min,bedtime,wake_time').gte('night',from30).order('night',{ascending:false}),
    sb.from('cpap_session').select('night,usage_hours,ahi,myair_score').gte('night',from30).order('night',{ascending:false}),
    sb.from('daily_activity').select('day,steps,exercise_min').gte('day',from15).order('day',{ascending:false}),
    sb.from('heart_daily').select('day,resting_hr,hrv_sdnn,hr_max,spo2_pct').gte('day',from30).order('day',{ascending:false}),
    sb.from('workout').select('started_at,activity,duration_min,distance_mi').gte('started_at',addDays(today,-7)).order('started_at',{ascending:false}),
    sb.from('body_measurement').select('measured_at,value').eq('kind','weight').order('measured_at',{ascending:false}).limit(30),
    sb.from('clinical_record').select('recorded_on,resource').eq('resource_type','Observation').eq('display','Height').order('recorded_on',{ascending:false}).limit(1),
    sb.from('daily_record').select('mood,energy').eq('day',today).maybeSingle()
  ]);

  // ----- header: age, height, weight -----
  const cm = +(ht.data?.[0]?.resource?.valueQuantity?.value || 0);
  const inches = cm ? Math.round(cm/2.54) : null;
  const heightTxt = inches ? `${Math.floor(inches/12)}′${inches%12}″` : null;
  const W = wts.data || [];
  const wLast = W[0], wPrev = W.find(w => localDay(new Date(w.measured_at)) !== localDay(new Date(wLast?.measured_at||0)));
  const wDays = wLast ? Math.round((new Date(today) - new Date(localDay(new Date(wLast.measured_at))))/86400000) : null;
  const wChg = (wLast && wPrev) ? +wLast.value - +wPrev.value : null;
  const weightCard = `<div class="card wcard"><h3>⚖️ Weight</h3>
    ${wLast ? `<div class="big">${(+wLast.value).toFixed(1)}<small>lb</small></div>
      <div class="sub">${new Date(wLast.measured_at).toLocaleDateString('en-US',{month:'short',day:'numeric'})}${wDays>0?` · ${wDays}d ago`:' · today'}</div>
      ${wChg!=null ? `<div class="src">${wChg<0?'↓':wChg>0?'↑':'→'} ${Math.abs(wChg).toFixed(1)} lb since ${new Date(wPrev.measured_at).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'2-digit'})}</div>`:''}
      ${W.length>1?`${sparkSvg(W.slice(0,12).reverse().map(w=>+w.value))}<div class="src">last ${Math.min(12,W.length)} weigh-ins</div>`:''}
      ${wDays>7 ? `<div class="src">Step on the scale to update</div>`:''}` : '<p class="empty">No weigh-ins yet</p>'}</div>`;

  // ----- sleep -----
  const N = sleepNights(sleep.data||[], cpap.data||[]);
  const lastN = N[0];
  const last7 = N.filter(n => n.night > addDays(today,-7) && n.duration != null);
  const avg7 = avg(last7.map(n=>n.duration)), hit7 = last7.filter(n=>n.duration>=SLEEP_TARGET).length;
  const timed = N.map(n=>({n, t:timing(n)})).filter(x=>x.t);
  const usualBed = median(timed.map(x=>sinceSix(x.t.bedtime))), usualWake = median(timed.filter(x=>x.t.wake_time).map(x=>sinceSix(x.t.wake_time)));
  const lt = lastN && timing(lastN);
  const tag = (m, usual, laterWord, earlierWord) => (m==null||usual==null) ? '' : m-usual > 45 ? `<span class="chip warm">${laterWord}</span>` : usual-m > 45 ? `<span class="chip">${earlierWord}</span>` : '';
  const pctT = lastN?.duration ? Math.min(100, Math.round(lastN.duration/SLEEP_TARGET*100)) : 0;
  const week = N.filter(n => n.night > addDays(today,-7)).slice(0,7);
  const sleepCard = `<div class="card"><h3>😴 Sleep <span class="h3r">goal 7h</span></h3>
    ${lastN ? `
      <div class="big">${hm(lastN.duration)}</div>
      <div class="goalbar"><i style="width:${pctT}%"></i></div>
      <div class="sub">${lastN.night===today?'Last night':'Night ending '+shortDay(lastN.night)} · ${lastN.durationSrc==='cpap'?'CPAP mask-on':(SRC[lastN.durationSrc]||lastN.durationSrc)}
        ${lastN.duration>=SLEEP_TARGET ? ' · goal met 🎉' : lastN.duration ? ` · ${fmtMin(SLEEP_TARGET-lastN.duration).replace(/^0h /,'')} short of 7h` : ''}</div>
      ${lt ? `<div class="times"><div><b>${clock(lt.bedtime)}</b><span>to bed ${tag(sinceSix(lt.bedtime), usualBed, 'later than usual', 'earlier than usual')}</span></div>
        <div><b>${clock(lt.wake_time)}</b><span>woke up ${tag(lt.wake_time?sinceSix(lt.wake_time):null, usualWake, 'slept in', 'up early')}</span></div></div>
        <div class="src">Usual: bed ${clockFromSix(usualBed)} · up ${clockFromSix(usualWake)} (30-night median)</div>` : ''}
      ${avg7 ? `<p class="msg">7-night average <b>${fmtMin(avg7)}</b> · goal met ${hit7} of ${last7.length} nights</p>`:''}
      ${week.length ? `<div class="scroll"><table class="cmp tight"><tr><th>Night</th><th>Bed</th><th>Up</th><th>Sleep</th><th></th></tr>
        ${week.map(n=>{ const t = timing(n); const lateB = t && usualBed!=null && sinceSix(t.bedtime)-usualBed>45; const early = t?.wake_time && usualWake!=null && usualWake-sinceSix(t.wake_time)>45;
          return `<tr><td>${shortDay(n.night)}</td><td class="${lateB?'warmtxt':''}">${t?clock(t.bedtime):'—'}</td><td class="${early?'warmtxt':''}">${t?.wake_time?clock(t.wake_time):'—'}</td>
          <td>${hmm(n.duration)}</td><td class="minibar"><i style="width:${Math.min(100,(n.duration||0)/SLEEP_TARGET*100)}%" class="${(n.duration||0)>=SLEEP_TARGET?'ok':''}"></i></td></tr>`; }).join('')}
      </table></div>`:''}
      <details><summary>Compare sources for this night</summary>${sleepCompare(lastN)}</details>`
    : '<p class="empty">No recent sleep</p>'}</div>`;

  // ----- move -----
  const A = (act.data||[]).filter(r=>r.day<today);           // full days only
  const aToday = (act.data||[]).find(r=>r.day===today);
  const wkA = A.filter(r=>r.day>=addDays(today,-7)), prA = A.filter(r=>r.day<addDays(today,-7) && r.day>=addDays(today,-14));
  const s7 = avg(wkA.map(r=>+r.steps||0)), sP = avg(prA.map(r=>+r.steps||0));
  const m7 = wkA.reduce((t,r)=>t+(+r.exercise_min||0),0), mP = prA.reduce((t,r)=>t+(+r.exercise_min||0),0);
  const stepMsg = (s7!=null && sP!=null) ? (s7>=sP ? `👏 You're averaging <b>${fmtNum(s7-sP)} more steps a day</b> than the week before.` : `Last week averaged ${fmtNum(sP-s7)} more steps a day — a 15-minute walk closes most of that gap.`) : '';
  const minMsg = (prA.length && wkA.length) ? (m7>=mP ? `💪 <b>${fmtNum(m7-mP)} more active minutes</b> than the week before (${fmtNum(m7)} vs ${fmtNum(mP)}).` : `${fmtNum(m7)} active minutes this week vs ${fmtNum(mP)} the week before — one bike ride evens it up.`) : '';
  const WK = wk.data||[];
  const moveCard = `<div class="card"><h3>🚴 Move</h3>
    <div class="grid2"><div><div class="big">${fmtNum(aToday?.steps)}</div><div class="sub">steps today</div></div>
      <div><div class="big">${fmtNum(aToday?.exercise_min)}<small>min</small></div><div class="sub">active today</div></div></div>
    ${stepMsg?`<p class="msg">${stepMsg}</p>`:''}${minMsg?`<p class="msg">${minMsg}</p>`:''}
    <div class="sub" style="margin-top:10px">Workouts, last 7 days</div>
    ${WK.length ? `<table class="cmp tight">${WK.map(w=>`<tr><td>${esc(w.activity.replace(/([a-z])([A-Z])/g,'$1 $2'))}</td><td>${new Date(w.started_at).toLocaleDateString('en-US',{weekday:'short'})}</td><td>${w.duration_min?Math.round(w.duration_min)+' min':''}</td><td>${w.distance_mi?(+w.distance_mi).toFixed(1)+' mi':''}</td></tr>`).join('')}</table>`
      : `<p class="note" style="margin-top:4px">None logged yet this week — a walk or ride from your Watch shows up here.</p>`}
  </div>`;

  // ----- heart -----
  const Hd = heart.data||[];
  const latest = k => Hd.find(r=>r[k]!=null);
  const base = k => avg(Hd.filter(r=>r[k]!=null).slice(1).map(r=>+r[k]));     // 30-day baseline, excluding latest
  const chip = (v, b, lowerIsBetter, unit) => { if (v==null||b==null) return ''; const d = +v - b; if (Math.abs(d) < (unit==='%'?0.5:1)) return `<span class="chip neutral">at your usual</span>`;
    const good = lowerIsBetter ? d<0 : d>0; return `<span class="chip ${good?'':'neutral'}">${d<0?'↓':'↑'} ${Math.abs(d).toFixed(unit==='%'?1:0)} vs usual</span>`; };
  const rhr = latest('resting_hr'), hrv = latest('hrv_sdnn'), mx = latest('hr_max'), o2 = latest('spo2_pct');
  const tile = (label, r, k, unit, lowerBetter, digits=0) => `<div class="tile"><span>${label}</span><b>${r?(+r[k]).toFixed(digits):'—'}<small>${unit}</small></b>
    ${r && lowerBetter!==null ? chip(r[k], base(k), lowerBetter, unit) : r ? `<em>${new Date(r.day+'T12:00').toLocaleDateString('en-US',{month:'short',day:'numeric'})}</em>`:''}</div>`;
  const heartCard = `<div class="card"><h3>❤️ Heart</h3>
    <div class="tiles">${tile('Resting HR', rhr, 'resting_hr', 'bpm', true)}${tile('HRV', hrv, 'hrv_sdnn', 'ms', false)}
      ${tile('Max HR', mx, 'hr_max', 'bpm', null)}${tile('Blood O₂', o2, 'spo2_pct', '%', false, 1)}</div>
    <p class="note">"Usual" = your 30-day average. Blood O₂ comes from your Apple Watch.</p></div>`;

  const mood = dr.data?.mood, energy = dr.data?.energy;
  el.querySelector('.empty').outerHTML = `
    <div class="hero"><div><div class="hello">${greet}${name?', '+esc(name):''}</div>
      <div class="date">${new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}</div>
      <div class="me">${ageFrom(DOB)} yrs${heightTxt?` · ${heightTxt}`:''}</div></div>${weightCard}</div>
    ${sleepCard}${moveCard}${heartCard}
    <div class="card"><h3>How's today?</h3>
      <div class="row" id="mood">${['😫','😕','😐','🙂','😃'].map((e,i)=>`<button class="pick ${mood===i+1?'on':''}" data-v="${i+1}" aria-label="Mood ${i+1}">${e}</button>`).join('')}</div>
      <div class="sub" style="margin:12px 0 6px">Energy</div>
      <div class="row" id="energy">${[1,2,3,4,5].map(i=>`<button class="pick num ${energy===i?'on':''}" data-v="${i}">${i}</button>`).join('')}</div></div>
    <p class="note">Not medical advice. Check with your care team about anything that concerns you.</p>`;
  const save = async (field, v, row) => {
    row.querySelectorAll('.pick').forEach(b=>b.classList.toggle('on', +b.dataset.v===v));
    const { error } = await sb.from('daily_record').upsert({ user_id:user.id, day:today, [field]:v, updated_at:new Date().toISOString() }, { onConflict:'user_id,day' });
    if (error) alert('Could not save: '+error.message);
  };
  $('#mood').onclick = e => { const b=e.target.closest('.pick'); if(b) save('mood', +b.dataset.v, $('#mood')); };
  $('#energy').onclick = e => { const b=e.target.closest('.pick'); if(b) save('energy', +b.dataset.v, $('#energy')); };
}

/* ---------- trends (basic) ---------- */
async function loadTrends(){
  const el = $('#v-trends'), today = localDay(), from = addDays(today,-30);
  el.innerHTML = `<header class="top"><div class="hello">Trends</div></header><div class="empty">Loading…</div>`;
  const [sl, st, cp] = await Promise.all([
    sb.from('sleep_night').select('night,source,asleep_min,deep_min,rem_min').gte('night',from).order('night'),
    sb.from('health_metric').select('day,value').eq('metric','steps').eq('is_primary',true).gte('day',from).order('day'),
    sb.from('cpap_session').select('night,usage_hours,ahi,myair_score').gte('night',from).order('night')
  ]);
  const N = sleepNights(sl.data||[], cp.data||[]).reverse();
  const spark = (v) => { const mx = Math.max(...v,1);
    return `<div class="spark">${v.map((x,i)=>`<i class="${i===v.length-1?'last':''}" style="height:${Math.max(4,x/mx*100)}%"></i>`).join('')}</div>`; };
  const dur = N.filter(n=>n.duration!=null);
  // cross-check: per source averages + gap vs CPAP on shared nights
  const srcs = [['cpap','CPAP'],['oura','Oura'],['sleep_cycle','Sleep Cycle'],['watch','Apple Watch']];
  const val = (n,k) => k==='cpap' ? (n.cpap?.usage_hours ? n.cpap.usage_hours*60 : null) : (n[k]?.asleep_min ?? null);
  const stat = k => {
    const v = N.map(n=>val(n,k)).filter(x=>x!=null);
    const shared = N.filter(n=>val(n,k)!=null && n.cpap?.usage_hours && k!=='cpap');
    const gap = shared.length ? avg(shared.map(n=>val(n,k)-n.cpap.usage_hours*60)) : null;
    const deep = avg(N.map(n=>n[k]?.deep_min).filter(x=>x!=null)), rem = avg(N.map(n=>n[k]?.rem_min).filter(x=>x!=null));
    return {k, n:v.length, a:avg(v), gap, deep, rem};
  };
  const rows = srcs.map(([k,l])=>({...stat(k), l})).filter(r=>r.n);
  const fmtGap = g => g==null ? '—' : (g<0?'−':'+')+hmm(Math.abs(g));
  const cross = `<div class="card"><h3>😴 Sleep cross-check · last 30 days</h3>
    ${dur.length ? `<div class="big">${hm(avg(dur.map(n=>n.duration)))}</div><div class="sub">average nightly sleep (CPAP mask-on time when available) · ${dur.length} nights</div>${spark(dur.map(n=>n.duration))}` : '<p class="empty">No sleep data yet</p>'}
    ${rows.length ? `<div class="scroll"><table class="cmp tight"><tr><th>Source</th><th>Nts</th><th>Avg</th><th>vs CPAP</th><th>Deep</th><th>REM</th></tr>
      ${rows.map(r=>`<tr class="${r.k==='cpap'?'lead':''}"><td>${r.l}</td><td>${r.n}</td><td>${hmm(r.a)}</td><td>${r.k==='cpap'?'—':fmtGap(r.gap)}</td><td>${r.deep!=null?Math.round(r.deep)+'m':'—'}</td><td>${r.rem!=null?Math.round(r.rem)+'m':'—'}</td></tr>`).join('')}
    </table></div><p class="note">"vs CPAP" compares the same nights only. Mask-on time includes time awake with the mask on, so the ring and Sleep Cycle usually read lower.</p>`:''}
  </div>`;
  const recent = N.slice(-14).reverse();
  const nightsTable = recent.length ? `<div class="card"><h3>Night by night</h3><div class="scroll"><table class="cmp tight">
    <tr><th>Night</th><th>CPAP</th><th>Oura</th><th>Cycle</th><th>Deep*</th><th>REM*</th></tr>
    ${recent.map(n=>{ const st = n.oura || n.sleep_cycle || {}; return `<tr><td>${new Date(n.night+'T12:00').toLocaleDateString('en-US',{month:'short',day:'numeric'})}</td>
      <td>${n.cpap?.usage_hours?hmm(n.cpap.usage_hours*60):'—'}</td><td>${n.oura?hmm(n.oura.asleep_min):'—'}</td><td>${n.sleep_cycle?hmm(n.sleep_cycle.asleep_min):'—'}</td>
      <td>${st.deep_min!=null?st.deep_min+'m':'—'}</td><td>${st.rem_min!=null?st.rem_min+'m':'—'}</td></tr>`; }).join('')}
  </table></div><p class="note">Times in h:mm. Cycle = Sleep Cycle. *Deep/REM from Oura when available, otherwise Sleep Cycle. Nights are dated by the morning you woke up.</p></div>` : '';
  const stv = (st.data||[]).map(r=>+r.value);
  el.querySelector('.empty').outerHTML = cross + nightsTable +
    `<div class="card"><h3>🚶 Steps · last 30 days</h3>${stv.length?`<div class="big">${fmtNum(avg(stv))}</div><div class="sub">average · ${stv.length} days</div>${spark(stv)}`:'<p class="empty">No data yet</p>'}</div>` +
    `<p class="note">Fuller 7/30/90-day and 1-year views and the weekly summary arrive in Phase 4.</p>`;
}

/* ---------- me + importer ---------- */
const TABLES = ['health_metric','sleep_night','body_measurement','workout','cpap_session','clinical_record','daily_record'];
async function loadMe(){
  const el = $('#v-me');
  el.innerHTML = `<header class="top"><div><div class="hello">Me</div><div class="date">${esc(user.email)}</div></div><div class="ver">v${VERSION}</div></header>
    <div class="card"><h3>Import</h3>
      <p class="sub" style="margin:0 0 12px">Select files from <b>import_ready</b> (any or all), or a raw myAir <b>SLEEP_RECORD.csv</b>. Re-importing is safe; duplicates are replaced.</p>
      <div class="files"><label>Choose files<input type="file" id="files" multiple accept=".csv,.jsonl,.json"></label></div>
      <div class="bar" hidden id="bar"><i></i></div><div class="log" hidden id="log"></div></div>
    <div class="card"><h3>Your data</h3><table class="counts" id="counts"><tr><td class="empty">Counting…</td></tr></table></div>
    <button class="btn ghost" id="signout">Sign out</button>`;
  $('#files').onchange = e => runImport([...e.target.files]);
  $('#signout').onclick = () => sb.auth.signOut();
  refreshCounts();
}
async function refreshCounts(){
  const rows = await Promise.all(TABLES.map(async t => [t, (await sb.from(t).select('*',{count:'exact',head:true})).count ?? 0]));
  $('#counts').innerHTML = rows.map(([t,n])=>`<tr><td>${t.replace('_',' ')}</td><td>${fmtNum(n)}</td></tr>`).join('');
}
function parseCSV(text){
  const rows=[]; let row=[], f='', q=false;
  for (let i=0;i<text.length;i++){
    const c=text[i];
    if (q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if (c==='"') q=true;
    else if (c===','){ row.push(f); f=''; }
    else if (c==='\n'){ row.push(f.replace(/\r$/,'')); rows.push(row); row=[]; f=''; }
    else f+=c;
  }
  if (f || row.length){ row.push(f); rows.push(row); }
  const head = rows.shift() || [];
  return rows.filter(r=>r.length>1).map(r => Object.fromEntries(head.map((h,i)=>[h, r[i]])));
}
const nul = v => (v===undefined || v==='' ) ? null : v;
const num = v => nul(v)==null ? null : +v;
const bool = v => v==='True' || v==='true';
function shape(kind, rows){
  switch(kind){
    case 'health_metric': return rows.map(r=>({day:r.day, metric:r.metric, source:r.source, value:+r.value, unit:nul(r.unit), is_primary:bool(r.is_primary)}));
    case 'sleep_night': return rows.map(r=>({night:r.night, source:r.source, bedtime:nul(r.bedtime), wake_time:nul(r.wake_time),
      in_bed_min:num(r.in_bed_min), asleep_min:num(r.asleep_min), awake_min:num(r.awake_min), deep_min:num(r.deep_min), rem_min:num(r.rem_min), core_min:num(r.core_min), is_primary:bool(r.is_primary)}));
    case 'body_measurement': return rows.map(r=>({measured_at:r.measured_at, kind:r.kind, value:+r.value, value2:num(r.value2), unit:nul(r.unit), source:r.source}));
    case 'workout': return rows.map(r=>({started_at:r.started_at, activity:r.activity, duration_min:num(r.duration_min), distance_mi:num(r.distance_mi), active_kcal:num(r.active_kcal), source:nul(r.source)}));
    // cpap_session.csv 'night' column holds the myAir session date (evening); wake date = +1
    case 'cpap_session': return rows.map(r=>{ const sd = r.session_date || r.night; return {night:addDays(sd,1), session_date:sd, usage_hours:num(r.usage_hours), ahi:num(r.ahi), leak_50:num(r.leak_50), leak_95:num(r.leak_95), myair_score:num(r.myair_score), mask_on_off:num(r.mask_on_off), mode:nul(r.mode)}; });
    case 'myair_raw': {
      const by = {};
      for (const r of rows){ if (r.EVENTNAME==='REMOVE' || !r.SESSION_DATE) continue;
        const o = by[r.SESSION_DATE]; if (!o || (r.APPROXIMATECREATIONDATETIME||'') > (o.APPROXIMATECREATIONDATETIME||'')) by[r.SESSION_DATE]=r; }
      return Object.values(by).map(r=>({night:addDays(r.SESSION_DATE,1), session_date:r.SESSION_DATE, usage_hours:num(r.USAGE_HOURS)!=null?Math.round(r.USAGE_HOURS*100)/100:null, ahi:num(r.AHI), leak_50:num(r.LEAK_50_PERCENTILE), leak_95:num(r.LEAK_95_PERCENTILE), myair_score:num(r.SLEEP_SCORE), mask_on_off:num(r.MASK_SESSION_COUNT), mode:nul(r.MODE)}));
    }
  }
}
const CONFLICT = {health_metric:'user_id,day,metric,source', sleep_night:'user_id,night,source', workout:'user_id,started_at,activity', cpap_session:'user_id,night', clinical_record:'user_id,resource_type,resource_id', body_measurement:'user_id,kind,measured_at,source'};
function kindOf(name, firstLine){
  if (/SESSION_DATE/.test(firstLine)) return 'myair_raw';
  for (const k of ['health_metric','sleep_night','workout','cpap_session','clinical_record','body_measurement']) if (name.startsWith(k)) return k;
  return null;
}
async function runImport(files){
  const log = $('#log'), bar = $('#bar'); log.hidden = bar.hidden = false; log.textContent = '';
  const say = s => { log.textContent += s + '\n'; log.scrollTop = log.scrollHeight; };
  const setBar = p => bar.firstElementChild.style.width = (p*100).toFixed(1)+'%';
  for (const file of files){
    const text = await file.text();
    const kind = kindOf(file.name, text.slice(0, 2000));
    if (!kind){ say(`⚠️ ${file.name}: not recognized, skipped`); continue; }
    let rows;
    if (kind==='clinical_record') rows = text.split('\n').filter(Boolean).map(l=>JSON.parse(l));
    else rows = shape(kind, parseCSV(text));
    const table = kind==='myair_raw' ? 'cpap_session' : kind;
    { const keys = CONFLICT[table].split(',').filter(k=>k!=='user_id'), m = new Map();
      for (const r of rows) m.set(keys.map(k=>r[k]).join('|'), r);   // last copy wins; avoids duplicate keys in one batch
      rows = [...m.values()]; }
    const dates = rows.map(r=>r.day||r.night||r.recorded_on||(r.started_at||r.measured_at||'').slice(0,10)).filter(Boolean).sort();
    const { data: batch, error: be } = await sb.from('import_batch').insert({ user_id:user.id, source: kind==='myair_raw'?'myair':'apple_health_export', file_name:file.name, record_count:rows.length, date_from:dates[0]||null, date_to:dates.at(-1)||null, status:'running' }).select('id').single();
    if (be){ say(`❌ ${file.name}: ${be.message}`); continue; }
    say(`${file.name} → ${table}: ${rows.length.toLocaleString()} rows`);
    const size = table==='clinical_record' ? 100 : 1000; let done = 0, failed = 0;
    for (let i=0;i<rows.length;i+=size){
      const chunk = rows.slice(i,i+size).map(r=>({...r, user_id:user.id, import_batch_id:batch.id}));
      let { error } = await sb.from(table).upsert(chunk, { onConflict: CONFLICT[table] });
      if (error){ await new Promise(r=>setTimeout(r,1200)); ({ error } = await sb.from(table).upsert(chunk, { onConflict: CONFLICT[table] })); }
      if (error){ failed += chunk.length; say(`  ❌ rows ${i}–${i+chunk.length}: ${error.message}`); }
      done += chunk.length; setBar(done/rows.length);
    }
    await sb.from('import_batch').update({ status: failed ? 'partial' : 'done' }).eq('id', batch.id);
    say(failed ? `  ⚠️ done with ${failed} failed rows` : `  ✅ done`);
  }
  say('Finished.'); refreshCounts();
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
init();
